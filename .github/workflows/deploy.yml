name: Deploy to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

# Needed for actions/deploy-pages to publish via OIDC.
permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it half-published.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - run: npm ci

      # Don't publish a broken tracker.
      - run: npm run test:ci

      - run: npm run build

      # `enablement` turns Pages on and sets its source to GitHub Actions, so a
      # fresh clone of this repo deploys without anyone visiting Settings first.
      # Without it the very first run fails with "Get Pages site failed".
      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: build

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
