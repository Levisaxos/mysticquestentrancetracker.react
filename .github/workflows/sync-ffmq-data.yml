name: Sync FFMQ data

# Upstream game data drifts — between Archipelago main and the 1.7 beta the
# entrance count moved 490 -> 493 and chests were split into Chest + HeroChest.
# Re-fetch on a schedule and open a PR when anything actually changed, so
# upstream fixes reach us without anyone remembering to look.

on:
  schedule:
    - cron: '0 5 * * 1' # Mondays, 05:00 UTC
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - run: npm ci

      - run: npm run sync-data
      - run: npm run build-binding

      # The integrity tests are the point: they fail if upstream changed shape
      # in a way our binding cannot absorb.
      - run: npm run test:ci

      - uses: peter-evans/create-pull-request@v6
        with:
          commit-message: 'chore: sync FFMQ data from upstream'
          branch: chore/sync-ffmq-data
          delete-branch: true
          title: 'Sync FFMQ data from upstream'
          body: |
            Automated re-sync of the canonical FFMQ data.

            `src/data/ffmq/meta.json` records the upstream ref and the new counts.
            Check the diff there first — a change in entrance or check counts
            means the marker binding needs revisiting.
          labels: data
